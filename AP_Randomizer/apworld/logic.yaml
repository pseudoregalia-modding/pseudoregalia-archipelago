          - has:
              slide_jump: 1
              kick: 1
    - region: Underbelly => Keep
      rule:
        has:
          plunge: 1
          slide: 1
  - name: Theatre Main
    exits:
    - region: Theatre Outside Scythe Corridor
      rule:
        has:
          cling: 6
    - region: Theatre Pillar
      rule:
        or:
        - has:
            kick: 2
        - has:
            kick: 1
            plunge: 1
          tags:
            old_obscure: 1
        - has:
            kick: 1
            slide_jump: 1
        - has:
            cling: 2
    - region: Castle => Theatre (Front)
      rule:
        or:
        - has:
            cling: 2
        - has: kick
        - has: slide_jump
  - name: Theatre Pillar => Bailey
    exits:
