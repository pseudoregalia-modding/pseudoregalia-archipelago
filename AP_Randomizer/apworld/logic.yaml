item_mapping:
  Dream Breaker: breaker
  Sun Greaves:
    name: kick
    count: 3
    max: 1
  Slide: slide
  Solar Wind: slide_jump
  Sunsetter: plunge
  Strikebreak: strikebreak
  Cling Gem:
    name: cling
    count: 6
    max: 1
  Ascendant Light: light
  Soul Cutter: cutter
  Heliacal Power: kick
  Small Key: small_key
  Major Key - Empty Bailey:
    name: major_key
    max: 1
  Major Key - The Underbelly:
    name: major_key
    max: 1
  Major Key - Tower Remains:
    name: major_key
    max: 1
  Major Key - Sansa Keep:
    name: major_key
    max: 1
  Major Key - Twilight Theatre:
    name: major_key
    max: 1
  Progressive Slide:
    - slide
    - slide_jump
  Air Kick: kick
  Progressive Dream Breaker:
    - breaker
    - strikebreak
    - cutter
  Cling Shard:
    name: cling
    count: 2

tags:
  - name: plunge_attack
    advanced:
      Sunsetter plunge does damage, even if you don't have Dream Breaker.
      In addition to breaking floors,
      this can be used to break weak walls and hit switches.
  - name: not_afraid_of_the_dark
    expert:
      With this tag, the Dungeon dark rooms are in logic as soon as you can enter them,
      even if you don't have a way to light your path.
  - name: slide_ultras
    description: This tech involves cancelling a slide and converting its high speed into a high jump.
    hard: At this level, you may be required to use slide ultras purely to gain height.
    expert: At this level, you may be required to use slide ultras for distance, which can require higher speed.
    lunatic: At this level, slide ultra setups may be very precise, involving very small runway or sharp angle changes.
  - name: old_obscure
    off: obscure is not expected
    on: obscure is expected

tag_groups:
  - name: basic_tech
    description: This group includes basic and well known tech and introduces meaningful additions at every logic level.
    children:
    - basic_slide_tech
    - basic_kick_tech
    # etc
  - name: obscure_tech
    description: This group compiles less known tech into a single group.
    children:
    - plunge_attack
    - not_afraid_of_the_dark
    # etc

ref_rules:
  - name: can_attack
    rule:
      or:
      - has: breaker
      - has: plunge
        tags:
          plunge_attack: 1
  - name: can_unlock_door
    rule:
      and:
      - ref: can_attack
      - or:
        - has:
            small_key: 7
        - has:
            small_key: 6
          tags:
            smart_keys: 1
  - name: can_enter_dark_rooms
    rule:
      or:
      - has: light
      - has: breaker
        tags:
          light_breaker: 1
      - tags:
          not_afraid_of_the_dark: 3

regions:
  - name: Dungeon Mirror
    exits:
    - region: Dungeon Slide
      rule:
        ref: can_attack
  - name: Dungeon Slide
    exits:
    - region: Dungeon Mirror
      rule:
        ref: can_attack
    - region: Dungeon Strong Eyes
      rule:
        has: slide
    - region: Dungeon Escape Lower
      rule:
        and:
          - ref: dungeon_escape
          - ref: can_attack
          - ref: can_enter_dark_rooms
      # keeping this version for reference, but keeping the assumptions about macros consistent
      # rule:
      #   or:
      #   - and:
      #     - ref: can_attack
      #     - ref: can_enter_dark_rooms
      #   - has: breaker
      #     tags:
      #       dungeon_escape: 1
  - name: Dungeon Strong Eyes
    exits:
    - region: Dungeon Slide
      rule:
        has: slide
    - region: Dungeon => Castle
      rule:
        or:
        - ref: can_unlock_door
        - tags:
            old_obscure: 1
          options:
            game_version: map_patch
        - or:
          - has: bounce
          - ref: can_attack
            has:
              kick: 2
          - ref: can_attack
            has:
              cling: 2
  - name: Dungeon => Castle
    exits:
    - region: Dungeon Mirror
    - region: Dungeon Strong Eyes
      rule:
        or:
        - ref: can_unlock_door
        - tags:
            old_obscure: 1
          options:
            game_version: map_patch
          or:
          - has: plunge
          - ref: can_attack
            has: kick
    - region: Castle Main
      entrance_name: Dungeon Top Exit
  - name: Dungeon Escape Lower
    exits:
    - region: Dungeon Slide
      rule:
        ref: can_attack
    - region: Dungeon Escape Upper
      rule:
        or:
        - has: bounce
        - has:
            kick: 1
            plunge: 1
        - has:
            kick: 3
    - region: Underbelly => Dungeon
  - name: Dungeon Escape Upper
    exits:
    - region: Dungeon Escape Lower
    - region: Theatre Outside Scythe Corridor
      rule:
        or:
        - has: bounce
        - has: kick
        - has:
            cling: 2
        - tags:
            old_obscure: 1
          has: plunge
  - name: Castle Main
    exits:
    - region: Dungeon => Castle
    - region: Keep Main
    - region: Bailey Lower
    - region: Library Main
      rule:
        ref: can_attack
    - region: Castle => Theatre Pillar
      rule:
        or:
        - has:
            cling: 2
            kick_or_plunge: 1
        - has:
            kick_or_plunge: 2
    - region: Castle Spiral Climb
      rule:
        or:
        - has:
            kick: 2
        - has:
            cling: 2
            plunge: 1
    - region: Keep (Northeast) => Castle
      rule:  # TODO: not sure about this logic, idk where doing it with no items should go
        or:
        - ref: can_attack
        - tags:
            old_obscure: 1
  - name: Castle Spiral Climb
    exits:
    - region: Castle Main
    - region: Castle High Climb
      rule:
        or:
        - has:
            cling: 2
        - has:
            kick: 3
            plunge: 1
        - ref: can_attack
          has: kick
    - region: Castle By Scythe Corridor
      rule:
        has:
          cling: 2
  - name: Castle High Climb

  - name: Castle By Scythe Corridor
    exits:
    - region: Castle Spiral Climb
      rule:
        or:
        - has:
            cling: 2
        - has:
            kick: 4
            plunge: 1
    - region: Castle High Climb
      rule:
        or:
        - has:
            cling: 2
        - has:
            kick: 4
        - has:
            kick: 2
            plunge: 1
        - has:
            kick: 1
            plunge: 1
            slide_jump: 1
    - region: Castle => Theatre (Front)
      rule:
        has:
          cling: 4
          kick_or_plunge: 2
  - name: Castle => Theatre (Front)
    exits:
    - region: Castle By Scythe Corridor
      rule:
        or:
        - has:
            cling: 2
        - has:
            slide_jump: 1
            kick: 1
        - has:
            kick: 4
    - region: Castle Moon Room
      rule:
        or:
        - has:
            cling: 2
        - has:
            slide_jump: 1
            kick_or_plunge: 2
    - region: Theatre Main
      rule:
        or:
        - has:
            plunge: 1
            kick: 1
        - has:
            kick: 2
  - name: Castle Moon Room


  - name: Library Main
