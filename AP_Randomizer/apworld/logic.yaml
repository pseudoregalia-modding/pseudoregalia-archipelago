            plunge: 1
    - region: Castle Main
      rule:
        ref: can_attack
  - name: Library Locked

  - name: Library Greaves
    exits:
    - region: Library Back
      rule:
        ref: can_attack
        or:
        - has:
            cling: 2
        - has:
            kick: 2
  - name: Library Top
    exits:
    - region: Library Back
      rule:
        or:
        - has:
            cling: 2
            kick_or_plunge: 1
        - has:
            kick: 3
            plunge: 1
        - has:
            kick: 3
            bounce: 1
  - name: Library Back
    exits:
    - region: Library Greaves
      rule:
        ref: can_attack
        or:
        - has:
            cling: 2
        - has:
            kick: 1
    - region: Library Top
      rule:
        or:
        - has:
            cling: 4
        - has:
            kick: 2
  - name: Keep Main
    exits:
    - region: Keep Locked Room
      rule:
        or:
        - ref: can_unlock_door
        - has:
            kicks: 3
        - has:
            plunge: 1
            kick: 1
        - has:
            cling: 2
            plunge: 1
        - has:
            cling: 2
            kick: 1
      # Note for trackers: This is accessible with nothing but not in logic.
      # Cutting the platform or hitting the lever make this harder and are irreversible.
      # On Hard and above, the player is expected to not do either.
    - region: Keep Sunsetter
      rule:
        has:
          cling: 2
          # See "Keep Main -> Keep Locked Room".
          # All other methods would go through Keep Locked Room instead.
    - region: Keep Throne Room
      rule:
        or:
        - and:
          - has:
              breaker: 1
              cling: 6
          - or:
              - has:
                  plunge: 1
                  kick: 1
              - has:
                  plunge: 1
                  bounce: 1
              - has:
                  kick: 1
                  bounce: 1
        - has:
            bounce: 1
            kick_or_plunge: 4
    - region: Keep => Underbelly
      rule:
        or:
        - has: kick_or_plunge
        - has:
            cling: 2
    - region: Theatre Outside Scythe Corridor
      rule:
