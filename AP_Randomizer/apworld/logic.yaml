              kick_or_plunge: 4
          - options:
              game_version: map_patch
            has:
              kick: 1
              plunge: 1
              bounce: 1
        - or: # get onto the bridge
          - has: slide_jump
          - has: plunge
            tags:
              old_obscure: 1

